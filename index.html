const sayBtn=(text,label='播放日文',small=false)=>`<button class="speakbtn" type="button" data-say="${esc(text)}" aria-label="${esc(label)}" title="${esc(label)}">🔊</button>`;

function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function speak(text,btn){if(!('speechSynthesis' in window)){toast('此瀏覽器沒有日文朗讀功能');return}window.speechSynthesis.cancel();if(activeSpeechBtn)activeSpeechBtn.classList.remove('playing');if(activeSpeechBtn===btn){activeSpeechBtn=null;return}const u=new SpeechSynthesisUtterance(text.replaceAll('春聯','しゅんれん'));u.lang='ja-JP';u.rate=1.1;u.pitch=1;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='ja-jp'&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith('ja'))||null;u.onend=u.onerror=()=>{if(activeSpeechBtn===btn){btn?.classList.remove('playing');activeSpeechBtn=null}};activeUtterance=u;activeSpeechBtn=btn;if(btn)btn.classList.add('playing');window.speechSynthesis.speak(u)}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel();activeSpeechBtn?.classList.remove('playing');activeSpeechBtn=null;activeUtterance=null}

function renderQuizIntro(){const toTW=quizMode==='toTW';return `${header('ACTIVITY 01','台日漢字比一比','台湾と日本の漢字を比べてみよう！')}<div class="gap24"></div><div class="two-col wideleft"><div class="stack">${toTW?bi('先看日本熟悉的漢字，再從 A、B、C 找出台灣的繁體字。猜完才揭曉答案。','まず日本の漢字を見て、A・B・Cの中から台湾の繁体字を選びましょう。答えはあとで発表します。'):bi('先看台灣繁體字，再從 A、B、C 猜日本通常怎麼寫。','まず台湾の漢字を見て、A・B・Cの中から日本で使われる字を選びましょう。')}${bi('作答後可以點擊繁體字，觀看筆順動畫，再用老師發下的中空描字練習單練習。','答え合わせのあと、漢字をタップすると書き順のアニメーションが見られます。配られた練習プリントでも書いてみましょう。')}<div class="callout">${bi('一共有六題，最後還有馬年的趣味題。','全部で六問あります。最後は「午年」に関するおまけのクイズもあります。')}</div><div class="row" style="flex-wrap:wrap"><button class="btn" data-goto="q0">開始第一題 ↗</button><button class="btn outline" data-mode="${toTW?'toJP':'toTW'}">${toTW?'切換舊版題型（猜日本字）':'切換新版題型（猜台灣繁體字）'}</button></div></div><div class="quiz-intro-art"><div class="quiz-glyph">?</div><div class="quiz-intro-abc"><span>A</span><span>B</span><span>C</span></div><p>答えはどれでしょう？</p><div class="gap8"></div>${jp('正しいと思う漢字を選んでください。')}</div></div>`}

function renderQuiz(i){const q=quiz[i],s=selected[i],revealedNow=!!revealed[i],toTW=quizMode==='toTW',choices=toTW?twQuizOptions[i]:q.choices,correct=toTW?twCorrect[i]:q.correct,target=toTW?q.jp:q.tw,answer=toTW?q.tw:q.jp;return `<div class="kicker">ACTIVITY 01　/　QUESTION ${i+1} / 6</div><div class="row between quiz-heading" style="align-items:flex-start"><div><h1 class="headline">台日漢字比一比</h1><div class="gap8"></div>${jp(toTW?'日本の漢字は、台湾ではどう書きますか？':'台湾の漢字は、日本ではどう書きますか？')}</div><div class="quiz-progress">${i+1} / 6</div></div><div class="quiz-layout"><div><div class="big-character" aria-label="${toTW?'日本字形':'台灣繁體字'}：${target}">${target}</div><div class="gap8"></div><div class="quiz-label">${toTW?'日本の漢字｜日本字形':'台湾の繁体字｜台灣繁體字'}</div></div><div><h2 class="quiz-instruction">${toTW?'哪一個是台灣繁體字？':'哪一個是日本常用字形？'}</h2><div class="options">${choices.map((ch,j)=>`<button class="option ${s===j?'chosen':''} ${revealedNow?(correct===j?'correct':s===j?'wrong':''):''}" data-option="${j}" ${revealedNow?'disabled':''} aria-pressed="${s===j}"><small>${'ABC'[j]}</small>${ch}</button>`).join('')}</div><button class="btn ${revealedNow?'outline':''}" data-reveal="1" style="width:100%" ${typeof s!=='number'?'disabled':''}>${revealedNow?'答案已揭曉':'公布答案・正解を見る'}</button><div class="gap16"></div>${revealedNow?`<div class="answer-card"><div class="answer-text">正解：${'ABC'[correct]}</div><div class="answer-character-display"><div class="answer-character-label">${toTW?'台灣繁體字｜台湾の繁体字':'日本常用字形｜日本の漢字'}</div><div class="answer-character">${answer}</div></div>${bi(q.note,q.noteJP)}<div class="quiz-practice"><span>✍️ 現在練習繁體字筆順</span><button class="btn outline" data-stroke="${q.tw}">▶ 「${q.tw}」筆順動畫</button>${jp('この漢字の書き順を見て、練習してみましょう。')}</div><div class="divider"></div><div class="mono-note">延伸春聯祝福語・春聯の言葉</div><div class="phrase-big-result">${q.phrase}</div>${bi(q.meaning,q.jpMeaning)}${q.extra?`<div class="callout" style="margin-top:12px">${bi('台灣說「馬年」，日本說「午年（うまどし）」。','台湾では「馬年」と言います。日本では「午年（うまどし）」と言います。','台湾では馬 function renderSingle(){const a=selectedSingle;return `${header('ACTIVITY 03','斗方：選一個吉祥字','好きな縁起のよい漢字を一つ選びましょう！')}<div class="gap12"></div>${bi('點選一個字，右邊就會出現斗方成品預覽。可以加上圖畫，做出自己的創意春聯。','漢字を一つ選ぶと、右側の赤い紙に表示されます。絵や模様を加えて、自分だけの春聯を作りましょう。')}<div class="design-workshop"><div class="design-list">${singles.map(d=>`<button class="pick-card ${d.c===a.c?'is-selected':''}" data-pick-single="${d.c}"><span class="pick-char">${d.c}</span><span><b>${d.py}</b><small>${d.cn}</small></span></button>`).join('')}</div><div class="design-preview"><div class="design-topline">斗方完成示意・完成イメージ</div><div class="square-art-wrap"><div class="square-paper"><div class="square-character">${a.c}</div><svg class="plum-drawing" viewBox="0 0 125 115" role="img" aria-label="梅花插畫"><path d="M4 105 C27 93 35 69 42 48 M40 54 C57 50 66 36 76 26 M35 68 C60 73 76 66 94 52" fill="none" stroke="#f8c786" stroke-width="4" stroke-linecap="round"/><g fill="#fff1c9" stroke="#ffe2a6" stroke-width="1"><circle cx="47" cy="46" r="9"/><circle cx="63" cy="42" r="9"/><circle cx="51" cy="31" r="9"/><circle cx="34" cy="34" r="9"/><circle cx="37" cy="51" r="9"/><circle cx="82" cy="48" r="8"/><circle cx="96" cy="41" r="8"/><circle cx="91" cy="58" r="8"/><circle cx="77" cy="63" r="8"/><circle cx="71" cy="52" r="8"/></g><g fill="#c54831"><circle cx="47" cy="42" r="5"/><circle cx="84" cy="51" r="5"/></g><path d="M44 75 Q22 65 20 56 Q39 53 44 75 M55 61 Q66 78 83 75 Q72 57 55 61" fill="#e8b56c" stroke="#ebd0a0" stroke-width="1.5"/></svg></div></div><div class="design-illustration-note">花朵圖案僅供參考，也可以畫自己喜歡的圖案。<br><span lang="ja">花の模様は一例です。好きな絵を描いてもいいですよ。</span>${sayBtn('花の模様は一例です。好きな絵を描いてもいいですよ。')}</div>${bi(a.cn,a.jp)}<div class="preview-actions"><button class="btn outline" data-stroke="${a.c}">▶ ${a.c} 的筆順</button><button class="btn outline" data-single="${a.c}">▦ 查看中空描字</button></div></div></div>`}
function renderCouplets(){const a=selectedCouplet;return `${header('ACTIVITY 03','四字春聯：選一句祝福','四文字の縁起のよい言葉を選んでみましょう！')}<div class="gap16"></div>${bi('點選左側四字詞語，右邊會顯示春聯成品預覽。可以依自己喜好搭配簡單圖案。','左の四文字の言葉を選ぶと、右に春聯の完成イメージが表示されます。好きな絵や模様も加えてみましょう。')}<div class="design-workshop couplet-workshop"><div class="design-list phrase-picks">${couplets.map(p=>`<button class="pick-card ${a.text===p.text?'is-selected':''}" data-pick-phrase="${p.text}"><span class="pick-phrase">${p.text}</span><small>${p.cn}</small></button>`).join('')}</div><div class="design-preview"><div class="design-topline">四字春聯完成示意・完成イメージ</div><div class="vertical-couplet-preview"><span class="couplet-top">✿</span><div class="couplet-vertical">${[...a.text].map(c=>`<span>${c}</span>`).join('')}</div><span class="couplet-bottom">❀</span></div><div class="selected-phrase-label">${a.text} <small>${a.py}</small></div>${bi(a.cn,a.jp)}<div class="preview-actions"><button class="btn outline" data-phrase="${a.text}">▦ 看中空描字格</button>${[...new Set([...a.text])].map(c=>`<button class="btn outline" data-stroke="${c}">${c} 筆順</button>`).join('')}</div></div></div>`}
function renderSquareGallery(){return `${header('ACTIVITY 03','斗方與春聯：歷年作品欣賞','以前の作品を見てみましょう！')}<div class="gap16"></div>${bi('斗方不一定只有書法字。看看以前的作品：有人畫生肖、加上圖案，也有人將文字與插畫結合。','春聯には漢字だけでなく、干支の絵や好きな模様を自由に加えてもいいですよ。以前の作品を見てみましょう。')}<div class="gallery gallery-rich" style="margin-top:20px"><figure class="galleryfigure">${thumb('gallery-creative1.jpg','學生結合生肖與書法的創意斗方')}<figcaption>生肖與書法・干支の絵と漢字</figcaption></figure><figure class="galleryfigure">${thumb('gallery-creative2.jpg','學生舉起作品的照片')}<figcaption>手繪圖案・自由なデザイン</figcaption></figure><figure class="galleryfigure">${thumb('gallery-creative3.jpg','學生展示春字斗方')}<figcaption>一字斗方・一文字の春聯</figcaption></figure><figure class="galleryfigure">${thumb('student-doufang-drawing.jpg','學生創作的文字與圖畫結合斗方')}<figcaption>文字與插畫・文字と絵の組み合わせ</figcaption></figure></div><div class="gap16"></div>${bi('拿起毛筆開始創作吧！筆尖輕輕接觸紙面，慢慢寫，不需要用力按壓。','筆を持って、書き始めましょう。筆先を紙に軽く当てて、ゆっくり書いてください。')}` }
function renderBookmarkIntro(){return `${header('ACTIVITY 04','書法書籤：兩個字的祝福','二文字で、オリジナルのしおりを作りましょう！')}<div class="gap16"></div><div class="two-col wideleft"><div class="stack">${bi('這次使用新的彩色書籤，長21公分、寬7公分。中間可以用毛筆寫上兩個繁體字。','今回は、縦21センチ・横7センチのしおりを使います。真ん中に、台湾の繁体字を筆で二文字書きましょう。')}${bi('兩個字較容易安排版面，也能清楚表達祝福；如果想寫四個字也可以，但字要寫得小一些。','二文字なら大きく書けて、きれいに仕上がります。四文字でもいいですが、少し小さく書く必要があります。')}${bi('完成後可加上自己的名字或簡單裝飾，當作交流的紀念。','書き終わったら、名前や簡単な飾りを加えてもいいですよ。交流の記念にしてください。')}</div>${thumb('new-bookmark-showcase.jpg','新版書法書籤三種範例：友好、圓滿、希望','hero-photo')}</div>`}
function renderBookmarkChoose(){return `${header('ACTIVITY 04','選一個想寫在書籤上的詞','しおりに書きたい言葉を選んでください。')}<div class="gap16"></div>${bi('選擇對自己有意義、想送給別人的祝福或勉勵自己的兩字詞語。點選後右邊會直接顯示在書籤上。','自分にとって大切な言葉や、誰かに贈りたい言葉を選んでください。選んだ言葉が右のしおりに表示されます。')}<div class="design-workshop"><div class="design-list bookmark-picks">${bookmarkWords.map(w=>`<button class="pick-card ${selectedWord.cn===w.cn?'is-selected':''}" data-bookmark="${w.cn}"><span class="pick-phrase">${w.cn}</span><span><small>${w.meaning}</small><small lang="ja">日本：${w.ja}</small></span></button>`).join('')}</div><div class="design-preview bookmark-design-preview"><div class="design-topline">書籤完成示意・完成イメージ</div><div class="bookmark-visual"><div class="bookmark"><div class="bookmark-text">${selectedWord.cn}</div></div></div>${bi(selectedWord.meaning,selectedWord.jmeaning)}<div class="preview-actions">${[...selectedWord.cn].map(c=>`<button class="btn outline" data-stroke="${c}">▶ ${c} 筆順</button>`).join('')}<button class="btn" data-goto="bookmark-steps">下一步：書籤創作 →</button></div></div></div>`}

function renderBookmarkSteps(){return `${header('ACTIVITY 04','拿起毛筆，製作書籤','筆で、しおりに書いてみましょう！')}<div class="gap16"></div><div class="two-col"><div class="bookmark-visual"><div class="bookmark"><div class="bookmark-text">${selectedWord.cn}</div></div></div><div class="stack"><div class="panel"><div class="kicker">SELECTED WORD</div><h2 style="font-size:28px;font-family:var(--serif)">${selectedWord.cn}</h2>${bi(selectedWord.meaning,selectedWord.jmeaning)}<div class="row">${[...selectedWord.cn].map(c=>`<button class="btn outline" data-stroke="${c}">看「${c}」筆順</button>`).join('')}</div></div>${bi('先觀察書籤中間的色紙區域，從上往下寫兩個字，記得預留適當空間。','しおりの色のついた部分に、上から下へ二文字を書きましょう。字と字の間を少し空けてください。')}${bi('墨汁乾了之後，可以加上名字、簡單的圖畫，並繫上流蘇。','墨が乾いたら、名前や簡単な絵を加えてもいいですよ。最後に房飾りをつけましょう。')}<button class="btn outline" data-goto="bookmark-choose">重新選字・言葉を選び直す</button></div></div>`}
function renderPhoto(){return `<div class="photo-stage"><div class="kicker">ACTIVITY 05 / PHOTO TIME</div><div class="photo-emoji">📸</div><h1 class="photo-title">作品完成！一起拍照吧！</h1><div class="gap16"></div>${jp('作品が完成しました！みんなで記念写真を撮りましょう！')}<div class="gap24"></div><div class="two-col"><div class="panel photo-panel">${bi('先拿起自己的春聯和書籤，與旁邊的同學互相欣賞。','まず春聯としおりを持って、お互いの作品を見せ合いましょう。')}${bi('請把作品拿在手上，一起到前面集合，我們要拍大合照！','作品を手に持って、前の方に集まってください。みんなで集合写真を撮ります！')}${bi('拍照時請面向鏡頭，展示自己的作品。','カメラの方を向いて、自分の作品を見せてください。')}</div><div class="photo-illustration">${thumb('photo-instruction.png','原簡報中使用手機拍照的插畫')}<div class="photo-caption">集合・しゅうごう！</div></div></div><div class="gap24"></div><button class="btn" data-goto="farewell">前往最後感謝頁 →</button></div>`}
function renderFarewell(){return `<div class="farewell farewell-clean"><div class="farewell-content"><div class="farewell-small">台日交流・漢字書法體驗</div><h1>今日活動圓滿結束</h1><div class="jp-farewell">${jp('今日の体験はこれで終わりです。')}</div><h2>謝謝大家</h2><div class="jp-farewell">${jp('みなさん、ありがとうございました！')}</div><h2>歡迎再來台灣</h2><div class="jp-farewell">${jp('またぜひ台湾に来てください！')}</div><div class="farewell-divider" aria-hidden="true">✦</div><button class="btn outline" data-goto="home">⌂ 回首頁</button></div></div>`}
function render(){const s=slides[current];if(!s)return;stopSpeech();let html='';if(s.id==='home')html=renderHome();else if(s.id==='quiz-intro')html=renderQuizIntro();else if(s.id.startsWith('q')&&/^q\d+$/.test(s.id))html=renderQuiz(Number(s.id.slice(1)));else if(s.id==='stroke-intro')html=renderStrokeIntro();else if(s.id==='stroke-words')html=renderStrokeWords();else if(s.id==='stroke-demo')html=renderStrokeDemo();else if(s.id==='square-intro')html=renderSquareIntro();else if(s.id==='square-single')html=renderSingle();else if(s.id==='square-words')html=renderCouplets();else if(s.id==='square-gallery')html=renderSquareGallery();else if(s.id==='bookmark-intro')html=renderBookmarkIntro();else if(s.id==='bookmark-choose')html=renderBookmarkChoose();else if(s.id==='bookmark-steps')html=renderBookmarkSteps();else if(s.id==='photo')html=renderPhoto();else if(s.id==='farewell')html=renderFarewell();$('#slide').innerHTML=html;$('#stepCaption').textContent=(current+1)+' / '+slides.length+'　'+s.title;$('#prev').disabled=current===0;$('#next').textContent=current===slides.length-1?'完成 ✓':'下一頁 →';$('#next').disabled=current===slides.length-1;$('#nav').innerHTML=groups.map(g=>`<button class="navbtn ${s.group===g.id?'active':''}" data-goto="${g.slide}" title="${g.jp}">${g.title}</button>`).join('');$('#progress').innerHTML=slides.map((r,i)=>`<i class="${i===current?'active':''}" title="${r.title}"></i>`).join('');window.scrollTo({top:0,behavior:'instant'});}
function go(id){const i=slides.findIndex(s=>s.id===id);if(i>=0){current=i;render();history.replaceState(null,'','#'+id)}}
function step(n){current=Math.min(slides.length-1,Math.max(0,current+n));render();history.replaceState(null,'','#'+slides[current].id)}
function openModal(content){$('#modal').innerHTML='<div class="row between"><div style="font-weight:900;color:#9d4a38">漢字書法體驗</div><button class="close-icon" data-close="1" aria-label="關閉">✕</button></div>'+content;$('#modalBackdrop').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){stopSpeech();$('#modalBackdrop').classList.remove('open');document.body.style.overflow='';writer=null;strokeLoadID++}
function openOpening(){const audio='みなさん、こんにちは。台湾へようこそ。私はこう先生です。今日は、一緒に楽しく漢字の書道を体験しましょう。よろしくお願いします。';openModal(`<div class="opening-full"><div class="kicker">先生用・開場白</div><h2 class="headline">開場白 <small lang="ja">はじめの挨拶</small></h2><p class="opening-hint">點開後直接照著下方日文朗讀即可，不分段、不編號。</p><div class="opening-script" lang="ja">みなさん、こんにちは！台湾へようこそ！<br>私は黄（こう）先生です。<br>今日は、いっしょに楽しく<br>漢字の書道を体験しましょう！<br>よろしくお願いします！</div><button class="btn" data-say="${esc(audio)}">🔊 聆聽整段日文</button></div>`) }
function openSingle(char){const s=singles.find(a=>a.c===char);if(!s)return;openModal(`<h2 style="font:900 37px var(--serif);margin-top:12px">${s.c}　<small style="font:500 15px sans-serif;color:#886c56">${s.py}</small></h2><div class="two-col"><div>${thumb('grid_'+char+'.png',char+'的中空描字格','hero-photo')}</div><div>${bi(s.cn,s.jp)}<button class="btn" data-stroke="${char}">▶ 看筆順動畫</button></div></div>`)}
function phraseArt(p){if(p.original)return thumb('phrase_'+p.text+'.png',p.text+'四字描字圖');return `<div class="phrase-modal-grid">${[...p.text].map(c=>`<div class="gridchar">${c}</div>`).join('')}</div>`}
function openPhrase(name){const p=couplets.find(a=>a.text===name);if(!p)return;const newSet=!p.original&&[...p.text].every(c=>['萬','事','如','意','恭','喜','發','財','平','安','樂','福','氣','滿','馬','到','成','功'].includes(c));const art=newSet?`<div class="phrase-modal-grid">${[...p.text].map(c=>thumb('outline_'+c+'.png',c+'字描寫格')).join('')}</div>`:phraseArt(p);openModal(`<h2 style="font:900 clamp(25px,4vw,40px) var(--serif);margin:12px 0">${p.text}</h2><p class="mono-note">${p.py}</p><div class="gap16"></div>${art}${bi(p.cn,p.jp)}<div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:15px">${[...new Set([...p.text])].map(c=>`<button class="btn outline" data-stroke="${c}">「${c}」筆順</button>`).join('')}</div>`)}
function openWord(name){const w=bookmarkWords.find(a=>a.cn===name);if(!w)return;selectedWord=w;go('stroke-demo')}
function openBookmark(name){const w=bookmarkWords.find(a=>a.cn===name);if(!w)return;selectedWord=w;toast('已選擇「'+name+'」');render()}
function openStroke(c){closeModal();characterCurrent=c;const id=++strokeLoadID;openModal(`<div class="row" style="justify-content:space-between;align-items:center;margin:12px 0"><div><div class="modal-kicker">筆順練習・書き順の練習</div><h2 style="font:900 34px var(--serif)">${c}</h2></div>${sayBtn('書き順のアニメーションを見て、練習しましょう。')}</div><div class="writer-box" id="writerBox"><div style="font-size:105px;color:#e3d0be" id="writerFallback">${c}</div></div><div class="writer-actions"><button class="btn" id="replayStroke">▶ 重新播放</button><button class="btn outline" id="quizStroke">✎ 手寫練習</button><button class="btn outline" id="resetStroke">↺ 重設</button></div><div class="gap16"></div>${bi('觀察每一筆的書寫順序，跟著動畫練習。','一画ずつ書く順番を見ながら、練習しましょう。')}<p id="writerMsg" class="tiny muted">正在載入筆順資料…</p><div class="sidebar-note" style="margin-top:10px">需連線載入筆順資料。若無法顯示，請確認網路後再試。</div>`);
 const showError=(m)=>{const msg=$('#writerMsg');if(msg)msg.textContent=m};
 if(typeof window.HanziWriter==='undefined'){showError('筆順程式尚未載入。請連上網路並重新開啟網頁。');return}
 try{writer=window.HanziWriter.create('writerBox',c,{width:264,height:264,padding:18,showOutline:true,showCharacter:false,strokeColor:'#91392d',outlineColor:'#e8d4c8',strokeAnimationSpeed:1.1,onLoadCharDataSuccess:()=>{if(id!==strokeLoadID)return;const f=$('#writerFallback');if(f)f.style.display='none';showError('已載入，可重新播放或進入手寫練習。');writer.animateCharacter()},onLoadCharDataError:()=>showError('目前無法取得此字的筆順資料，請檢查網路連線。')})}catch(e){showError('筆順動畫初始化失敗，請重整網頁。')}
}
function handleClick(e){const op=e.target.closest('[data-opening]');if(op){openOpening();return}const mode=e.target.closest('[data-mode]');if(mode){quizMode=mode.dataset.mode;selected={};revealed={};render();return}const pickSingle=e.target.closest('[data-pick-single]');if(pickSingle){selectedSingle=singles.find(x=>x.c===pickSingle.dataset.pickSingle)||selectedSingle;render();return}const pickPhrase=e.target.closest('[data-pick-phrase]');if(pickPhrase){selectedCouplet=couplets.find(x=>x.text===pickPhrase.dataset.pickPhrase)||selectedCouplet;render();return}const speakEl=e.target.closest('[data-say]');if(speakEl){e.stopPropagation();speak(speakEl.getAttribute('data-say'),speakEl);return}const close=e.target.closest('[data-close]');if(close){closeModal();return}const stroke=e.target.closest('[data-stroke]');if(stroke){openStroke(stroke.dataset.stroke);return}const goto=e.target.closest('[data-goto]');if(goto){closeModal();go(goto.dataset.goto);return}const option=e.target.closest('[data-option]');if(option){const idx=Number(slides[current].id.slice(1));if(!Number.isNaN(idx)&&!revealed[idx]){selected[idx]=Number(option.dataset.option);render()}return}const reveal=e.target.closest('[data-reveal]');if(reveal){const idx=Number(slides[current].id.slice(1));if(typeof selected[idx]==='number'){revealed[idx]=true;render()}return}const word=e.target.closest('[data-word]');if(word){openWord(word.dataset.word);return}const bookmark=e.target.closest('[data-bookmark]');if(bookmark){openBookmark(bookmark.dataset.bookmark);return}const sing=e.target.closest('[data-single]');if(sing){openSingle(sing.dataset.single);return}const phrase=e.target.closest('[data-phrase]');if(phrase){openPhrase(phrase.dataset.phrase);return}if(e.target.id==='replayStroke'){writer?writer.animateCharacter():toast('筆順動畫尚未載入');return}if(e.target.id==='quizStroke'){writer?writer.quiz({onComplete:()=>toast('練習完成！')}):toast('筆順動畫尚未載入');return}if(e.target.id==='resetStroke'){writer?writer.showCharacter():toast('筆順動畫尚未載入');return}}
$('#slide').addEventListener('click',handleClick);$('#modal').addEventListener('click',handleClick);$('#nav').addEventListener('click',handleClick);$('#brand').addEventListener('click',()=>go('home'));$('#goHome').addEventListener('click',()=>go('home'));$('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));$('#stopSound').addEventListener('click',()=>{stopSpeech();toast('已停止朗讀')});$('#fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}});$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalBackdrop').classList.contains('open')){closeModal();return}if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if($('#modalBackdrop').classList.contains('open'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(/^[123]$/.test(e.key)&&slides[current].id.startsWith('q')){if(!revealed[Number(slides[current].id.slice(1))]){selected[Number(slides[current].id.slice(1))]=Number(e.key)-1;render()}}else if(e.key==='Enter'&&/^q\d+$/.test(slides[current].id)){if(typeof selected[Number(slides[current].id.slice(1))]==='number'){revealed[Number(slides[current].id.slice(1))]=true;render()}}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&document.activeElement?.matches('[data-single],[data-phrase],[data-word],[data-bookmark]')){e.preventDefault();document.activeElement.click()}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(slides.some(s=>s.id===id))go(id)});const start=location.hash.slice(1);current=Math.max(0,slides.findIndex(s=>s.id===start));render();
</script>
</body>
</html>
